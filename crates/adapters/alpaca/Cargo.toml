[package]
name = "nautilus-alpaca"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Alpaca execution integration adapter for the Nautilus trading engine"
repository.workspace = true
homepage.workspace = true

[lib]
name = "nautilus_alpaca"
crate-type = ["rlib"]

# In-wheel-only adapter (the live `ExecutionClient` must share the engine's ABI — see
# the trading framework's `docs/milestone-5-alpaca-execution.md` §0). Compiles against the
# fork's own nautilus crates (HEAD, high-precision ON). M5.0 is a skeleton: an empty
# `impl ExecutionClient` + factory + config pyclass wired through the pyo3 registry. The
# HTTP/WS clients and order behavior land in M5.1+.

[features]
default = ["live"]
extension-module = [
  "nautilus-core/extension-module",
  "nautilus-live?/extension-module",
  "nautilus-model/extension-module",
  "nautilus-network/extension-module",
  "python",
  "pyo3/extension-module",
]
live = ["nautilus-live", "nautilus-live/node", "nautilus-system"]
python = [
  "live",
  "nautilus-core/python",
  "nautilus-live/python",
  "nautilus-model/python",
  "nautilus-system/python",
  "pyo3",
]
high-precision = ["nautilus-model/high-precision"]

[dependencies]
nautilus-common = { workspace = true, features = ["live"] }
nautilus-core = { workspace = true }
nautilus-execution = { workspace = true }
nautilus-live = { workspace = true, optional = true }
nautilus-model = { workspace = true }
nautilus-network = { workspace = true }
nautilus-system = { workspace = true, optional = true }

anyhow = { workspace = true }
async-trait = { workspace = true }
bytes = { workspace = true }
chrono = { workspace = true }
chrono-tz = { workspace = true }
log = { workspace = true }
rust_decimal = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
ustr = { workspace = true }

pyo3 = { workspace = true, optional = true }

[dev-dependencies]
rstest = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
